<div class="modal fade" id="editStation{{ i.id }}">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Station</h5>
                <button type="button"class="btn-close"data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="edit">
                    <input type="hidden"name="station_id" value="{{ i.id }}">

                    <label>Station Name</label>
                    <input type="text"name="station_name"class="form-control" value="{{ i.station_name }}">

                    <label>Station Code</label>
                    <input type="text"name="station_code"class="form-control"value="{{ i.station_code }}">

                    <label>City</label>
                    <input type="text"name="city"class="form-control"value="{{ i.city }}">

                    <label>State</label>
                    <input type="text"name="state"class="form-control"value="{{ i.state }}">

                    <div class="modal-buttons">
                        <button type="button" class="btn btn-secondary"data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary"> Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
